<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شيخ البلد - تحت الصيانة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #8B0000 0%, #A50000 60%, #6B0000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 3px solid #D4AF37;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #D4AF37;
      margin-bottom: 20px;
    }

    .logo-fallback {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B0000, #A50000);
      border: 3px solid #D4AF37;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .gear {
      font-size: 56px;
      margin-bottom: 8px;
      display: block;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #8B0000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #D4AF37;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #D4AF37, #F0C93A);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .message {
      font-size: 16px;
      font-weight: 700;
      color: #1a0000;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .submessage {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .badge {
      background: linear-gradient(135deg, #8B0000, #A50000);
      color: #D4AF37;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 50px;
      display: inline-block;
      margin-bottom: 24px;
      border: 2px solid #D4AF37;
    }

    .contact {
      background: #F8F4ED;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 13px;
      color: #555;
      border: 1px solid #e8e0cc;
    }

    .contact strong {
      color: #8B0000;
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }

    .phone-link {
      color: #8B0000;
      font-weight: 900;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      margin-top: 4px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D4AF37;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo-fallback">🍽️</div>

    <span class="gear">⚙️</span>

    <h1>شيخ البلد</h1>
    <div class="subtitle">نظام نقاط الولاء</div>
    <div class="divider"></div>

    <div class="message">الموقع تحت الصيانة مؤقتاً 🔧</div>
    <div class="submessage">
      بنعمل تحديثات عشان نقدملك تجربة أحسن<br>
      هنرجع قريباً إن شاء الله 🙏
    </div>

    <div class="badge">⏳ هنرجع قريباً</div>

    <div class="contact">
      <strong>محتاج مساعدة؟</strong>
      تواصل معانا على
      <a class="phone-link" href="tel:15188">📞 15188</a>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>
</body>
</html>
